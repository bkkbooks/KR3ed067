body:
  text: 方序上殘廢也但古今來方士口口相傳不肯輕泄故世醫所得不過紅升白降數方而已此靈藥祕方一卷多至四十餘翻其中奇方祕論皆世醫之所未聞康熙初年有蒲東方士師成千者不詳其為何人余於乾隆己亥偶遊廣陵市中獲醫方一卷乃師成子手書也讀其自序言壺中賣藥不過欲廣益世人為三千功行之助而祕惜過甚方中分兩皆為隱語以一兩為奇兩三錢為仁淺之預惟恐人知余細玩得其意而改正焉因嘆此書有裨於世而知之者絶少癸卯夏五來遊漢皋以示汪生圮公圮公欣然為付諸剞氏又輯同人屢驗之方為一卷附諸後以廣其傳其利濟之心有足多者因辨言於簡端天都方成培仰松氏題原序
