body:
  text: 靈藥祕方卷之上靈藥總論靈者先天一氣凝結於中神明變化不測之謂也古人云有七十二般爐火二十四品服食諸凡五金八石舉皆一一採而用之者誠有以見夫草根樹皮之藥不靈而金石煆煉之藥斯靈也奈何世人不察徒知靈藥之名而不知靈藥之實無論不能以廣微元奧即有間執一方亦必泥軌一病以為古人用藥不過如是更不復求靈藥之外更有加滅靈藥之中復有轉換而謬成已見以痼終身噫此特謂之死藥耳何靈之有尤可恨者既不聞靈藥之名又不習靈藥之事而妄調金石煉煆之不可輕服而病者遂緣以深信而不疑是以寧滅其身而無悟者皆斯言害之也殊不知古人立方必勝後人金石煆煉之不可服古人何苦多列品類以吳後人玉導石髓劉安餘膏何莫非金石煆煉而長房思邈諸公未嘗以此見誚也可見靈之功在會用與不會用而會用奧不會用在傳之傳染病富故他方俱按味而求而靈藥必須過手而得蓋雖小丹作用而實系大丹之頭腦因心制宜變幻莫測真如游龍之不可捉摸學者豈可因其金石煆煉而忽諸靈藥十例一對口他人但知鹽泥封口認為以鹽水和泥殊不知是二而一一而二者也如藥人罐先以鹽塊研碎以滾水沖之再以鹽水和薄泥蓋盞不必用紙條以泥塗盞遍合上加粱纏緊上放炭火即以筆蘸鹽水一轉一轉掃上約指厚再以薄泥封上齊盞遍永不定失石羔石脂俱非二固底藥少底猶可薄固藥多必須泥罐時分外厚些打一鐵兜住罐底上至半罐有兩環勾上上橫粱梁尾以鐵絲向下纏數套再以小釘撚上務緊為度即以小釘縷住塗泥絲上三辨水銀汞人謂水銀即汞不識水銀系市中所售者是也而汞乃硃砂中所取者凡靈藥俱當用汞用水銀者取其便也然水銀亦有攙鉛於中者白色者佳青色者有疵四取汞用陽城罐一個下鑽一小孔另用罐一個著水地下掘一坑罐口齊上以鑽孔罐頓上合縫處封固罐內用稻草燒灰存性鋪底以硃砂輕輕放上封固擦盞至半枝香去水以炭炙下共用三香俱要文火火約半罐便住五辨土倭硫靈藥中所用俱是倭硫系外邦所産微紅者是今俱用土硫性烈有損如必不得已而用亦有死硫法切不可用生硫六制硫土硫不拘多少打如豆大先用黃泥水煮一日二用醋煮一日三用側柏葉水煮一日四用浮萍水煮一日五用青苔水煮一日六用蘿蔔水煮一日七用豆腐漿煮一日八用豬大腸頭水煮一日九用鴨子湯水煮一日七打法世傳升降二料足矣未知有過橋打法兩罐並立中有橋梁通氣有重胎打法有兩罐橫放串打法有一罐之中先升後降打法有一罐之中先降後升打法有一罐之中隔作三四層打法種種法則不能枚舉姑存其概八火候升藥擦盞降藥不擦盞此其常也亦有升藥不擦但觀其中之藥性何如火有俱用文火到底俱用武火到底有文中之丈武中之武到底有半罐有矇頭內外俱紅者等等不一在運用之妙耳九顏色升者紅降者白夫人而知無庸議有升而白者黑者人所罕見有青者有加針者色固不同聊舉一二以見爐中造化不可思議十制靈藥誠不可輕用火性太燥當知製法其法不論服食與外敷先用黃泥煮一二天又用大白蘿蔔取空放藥入內水煮一二天又置土中埋七天又放井中離水尺許懸七天再以緑豆水甘草水各煮一天佩於人身半個月其效更大若外敷藥不必如此只以甘草煮足矣白降藥依法制去竟不大痛甚是奇事右靈藥之中細委曲折頗多難以開載特拈數項以見全功斯固親切過手所傳並參以獨得之祕非真正得手者不能領此也五氣朝元丹此丹利丸藥中服倭硫四錢二分南鉛七錢五分北鉛一兩雌黃三錢雄黃三兩右先以北鉛化開再以南鉛化開投入一處化勻打成如陽城罐底大大燈盞式先放一個仰於罐中後以硫雄雌三黃為末放上再以一罐覆之然後封固打文火兩炷香武火一炷半香俟盞中水滾以小米置盞內待米沉底即好二轉可加硫雄雌各二錢三轉以至九轉俱加硫雌雄各一錢取藥聽憑內外丸散中每筋加此靈藥三錢和服諸藥皆靈如一轉亦可用但無九轉者佳九轉靈砂丹此丹單服或加入丸中主化痰硃砂八兩倭硫一兩五錢右先將滴酷煮硃砂一二時辰取起以倭硫末炒砂頻頻添硫入炒砂黑為度入罐封固擦盞三文兩武約水十二盞為度冷取藥括下再以硫炒砂黑為度加起火以酷噴之研未入罐仍以前打罐中藥底研末蓋面封固打火五炷香如此打去至五轉俱是一樣至六轉以醋煮砂不用硫炒入罐仍以渣蓋面不用大罐只用小罐上約空三指封固還打五炷香上用棉花浸水放盞上冷取藥看有無汞珠如有珠仍用硫炒其醋煮轉轉如是至七轉先從上打半炷香慢慢退火不可見風從下再打五炷香看罐口有無氣味如無竟不用棉花浸水候冷取藥再煮再打照前七次降打七炷香為度九轉九炷香五文五武取藥磁罐收貯封固每用釐毫入口立能化痰凡丸藥中俱可量入神效二方系瀋陽正然老師所祕誠靈藥也第一方陽七腎散黑鉛七錢汞一兩土硫二錢右先將黑鉛化開入汞冷定研細同土硫末入鍋內慢炒作青筋頭色硫不必多加外用明礬一兩火硝九錢皂礬八分食鹽七錢共研入鍋炒乾帶紅色取起同上藥共研帶青色入罐如法封固打火三文一武武火擦盞四炷香冷定取出靠盞藥如鶴頂色或人生藥研末炒乾又合研入罐照前升打火候更妙第二方陰六賢散即前陽七賢散內中去土硫不用其製法分兩火候加藥悉照前法凡陰毒不痛者須六賢散陽毒不痛者用七賢散此二藥內症可服外毒腐肉可敷但外敷只釐許而內服不過一二分為止須依治例用之一凡遇毒瘡先須究其陰陽先與前散一二分量人壯實用之極能護心不致大害一再配回生散或三分或四分共研末煉蜜為丸加乳香沒藥血竭為衣服之免噁心吐逆泄瀉等症藥用紫草煎湯送下亦可如病重噁心惡寒欲彼吐紲更加一服即吐瀉矣一凡治惡疔則藥加穿山甲殭蠶峰房角剌蟬退防風銀花荊芥羌活歸尾桑皮連翹陳皮一上部加桔梗頭上加川芎藁本一下部加牛膝木瓜等分防風為使四法通之寒熱行之加減量人一瘡瘍倘傷寒冒風不能進飲食陳皮紫朴蒼朮銀花防風荊芥甘草歸尾連翹等分上下部同前加服一心經燥加黃連黃柏知母一肺經面赤喘促加黃耆一脾經胃太陽熱加大黃芒硝一少陽膽症加石菖蒲蔞仁一肝經加龍膽草甘菊黃柏芍藥一凡一切瘡毒痛者只須回生散加六賢散依後六門法治之一外點諸頑瘡惡毒腐肉作膿亦用並楊梅結毒不必問其新久淺深因時制宜用之萬無五失回生散腫毒初起用主發散番木鱉淨末四兩用水泡透去皮淨咀片少用麻油炒紫黃色以透為度研細川山甲一兩麻油炒透瓜兒血竭五錢炙乳香三錢去油淨沒藥三錢去油淨右共為細末勻收固每服三分至五分止切不可多用預囑病者倘量麻發戰切勿驚疑一時性過即安服時忌風若煉蜜為丸可加六賢散以乳沒血竭為衣服後麻戰飲熱酒或薑湯一鍾即止此藥與前六賢散並用之乃治外之要藥也凡治外症須分六門治往先痛而後腫者氣瘍形也先腫而後痛者形傷氣也喜怒風氣熱傷氣故先痛也寒傷形故先腫陰陽應象此其理也素問論之無過血症體熱氣疲體涼精病虛神病弱陰病頑陽病痛癰疽腫毒瘡癤魚口便毒騎襠諸症皆血熱妄行之故故火病回生散主之加痛極或熱甚外加六賢散主之一治一切惡毒初起者本藥三分加川山甲殭蠶末各一錢蔥湯下一治偏正頭風麻木不仁等症本藥三分加鬧楊花酒炒半分殭蠶一分好酒下取醉一治風氣遍身疼痛四肢走注指腫攣急腰膝足腿痠痛麻木等症本藥三分上部加桂枝薄荷姜活下部加牛膝木瓜四肢俱痛加感靈仙川烏草烏炮各一分共研末每服好酒送下盡醉一渾身疥癩皮膚俱爛本藥三分加白芷荊芥末各五分好酒送下盡醉一中風癱瘓手足偏枯及麻風皮毛脫落口眼歪斜遍身瘋癩不知痛癢本藥一兩加鬧楊花火酒製草烏炮各一錢五分天麻殭蠶各三分共研勻每服五分加麝香少許好酒送下取醉大汗為度一楊梅瘡不拘遠近本藥三分加牙皂銀花等分煎湯送下出大汗外用消風敗毒散不數日愈一楊梅癬牛皮癬頑瘡疥癩久遠不瘥本藥配白癬皮各等分每服五分第三方飛龍奪命丹兼治內外症主敗毒元精石白礬皂礬火硝各二兩硼砂滷砂各三錢右六味共研人鍋炒老黃色取起加汞二兩硃砂雄黃各五錢入罐封固如前火候冷定開取升藥又加生藥人罐打火四炷香藥俱同前但分兩不同汞砂雄硼滷分兩俱照前惟元精石皂白礬各一兩硝一兩五錢照前炒研細入罐封固火候俱同前冷取升藥又加硝皂白礬各七錢明雄一錢共研打火同前取出升藥又照前配打火三炷香乃內外科之聖藥也一瘡瘍兼膈食翻胃吐逆等症用本藥三錢加沉香木香各一錢白蔻仁丁香各五錢糊丸緑豆大淡薑湯下一丸日進三服一中滿臌脹水腫等症本藥二錢加沉香木香各一錢五分土狗三枚炙去頭足糊丸緑豆大每日空心用白商陸砂仁湯下三丸以平為止次用調理之齊一九種心痛腹中冷氣久不效者本藥三錢加乾薑良薑大椒各一錢或末或丸川椒湯下或砂仁湯下三分日三次一風寒濕氣流滯經絡筋骨疼痛本藥三錢加乳香沒藥去油各三錢鴉片硃砂砂各五分如無真鴉片以麝香少許代之好酒糊丸桐子大每服一丸用酒下日三次病久者先服黃金散取汗一婦人月經不行瘀血作痛或癥瘕痞塊本藥量加班毛紅娘子用米同炒去頭足每服八釐空心紅花酒下日三次以行為度虛弱者去班紅單取米用一治外科諸般腫毒本藥血竭各三錢蟬酥五分麝香三分糊丸桐子大每服一丸酒下按上下部服之日三次一治痰核馬疔結核等症本藥三錢膽星半夏貝母各一錢五分麝查二分滑破加乳香沒藥去油各一錢糊丸桐子大每服一丸日三次一楊梅結毒不拘遠近本藥硃砂各三錢雄黃銀硃各一錢黃臘為丸桐子大每服一丸土茯苓湯下一下疳蛀杆不拘遠近本藥硃砂雄黃各一錢乳香沒藥去油血竭龍骨各一錢為末摻之雨量一褶邊濕毒泡瘡久不收口者本藥乳香沒藥去油各一錢冰片三分黃白二蠟化入麻油少許熬膏貼之一喉風十八症本藥五釐好醋調勻滴入喉中吐去痰涎即效破爛者苦茶調敷牙疽口疳皆治一諾風癬頑癬牛皮血癬本藥量加白砒土硫黃為末或醋或油調敷第四方即前第一方藥味同惟打火盞內用水取升藥照前第三方加助藥之法打火三次每用藥研極細糕糊丸麻仁大每空心用人參湯或棗湯下一二十丸一瘡遇內症痰涎壅塞上盛下虛有升無降吐逆咳嗽痰火喘急膈食翻胃嘔吐等症陳皮湯下一翻胃膈食吐逆飽嘈丁香本香湯下一虛損欲成勞怯生薑烏梅湯下一偏正頭風痛久不愈川芎蔥湯下一心腹腫脹腿膝痠痛蓬朮湯下一陰虛盜汗小便過多元陽不足牡蠣湯下一男女氣血不和小腹急痛桃仁湯下一濕氣腳氣痠痛木瓜湯下一遺精淋獨白茯苓牡蠣湯下一陰症厥冷吐逆不下生薑湯下一失心癡呆神不守舍辰砂湯下一五疝昏厥不醒生薑湯下第五方節前第二方藥味同惟打火三轉後可月引藥專治外症取本藥雄黃硃砂各一兩乳香沒藥去油各二錢當歸白芷槐花各二兩加痛加丁香二錢等分為末老米糊丸桐子大聽用一凡楊梅瘡漏發背凜癧等惡瘡每服以牙皂一根土茯苓四兩煎湯初十日進五丸中十日進六丸後十日進七丸服後如寒熱乃毒氣出也不必驚疑第六方水銀枯礬火硝各一兩二錢硼砂滷砂各一錢二分右藥光共炒為細末入罐封固打火三炷香加爐甘石一兩二錢共研入罐再打火一炷杳半取出童便拌藥共炒攤地上如此炒攤七次復為末入罐封固打火一炷香半取出埋地內一日夜再為末加乳香沒藥去油各一錢二分又將童便拌曬加硃砂六分過篩研細磁缸收固每服土茯苓牙皂煎湯下一此散用法俱照前六賢散主治醫例其效更神第七方白雪丹鹽礬硝皂礬各二兩五錢右共研入鍋炒九分干加汞二兩硃砂五錢共研無星帶青色入包灑瓶內按緊上用布如瓶口大蓋住再用黃泥靠瓶遍周圍按緊中留一孔依瓶口大俟泥干再用夏布一塊扎瓶口用陽城罐一個將藥罐對口扎定封固如法再用大磁盆一個盛水在內將前藥瓶倒立空罐底立水盆內其盆上用磚如法隔之先將罐內藥圈記何處止其火亦止到藥邊為度或過藥一指亦可藥出上罐入下罐即過分火候其功效同猛火亦可先文後武共三炷香火足冷定取起下罐內有水不可橫浸入水濕了上罐口藥開罐取出其藥松白色為妙然不松白亦可用一此丹治一切腫毒出膿用之拔毒去其膿血未出膿者用之點起泡自破出水再用藥紙貼之自干而愈治未破者用陳醋少許調點如膿潰爛者可用六賢散摻之若誤上白雪丹痛不可忍亦敷六賢散藥紙貼之第八方藥紙杭州高白油紙一百張生甘草八兩先以淨水十五碗入甘草煎至六七碗去渣再煎至三四碗濃將紙分作四塊入鍋塊塊見汁煮乾為度取起㫰干收好聽用一凡點白雪丹泡破出水後用此紙照泡大小針刺白孔津濕貼之刺眼以便出水候自愈脫白雪丹犯膏藥其口更開更爛貼此藥紙最妙第九方白粉霜硼砂八錢火硝明礬各三兩甘草一兩右先將前三味共研再用甘草煎濃汁煮乾次用水銀輕粉各一兩五錢共研無星入罐對固打火三炷香擦盞冷定取升藥每一兩加血竭三錢乳勻收固聽用一此霜兼治內外證大人止服一分三釐小兒止可服七釐須分上下部引藥送下以上九方一氣呵成加減火候可悉照其例固有缺一不可者三花聚頂丹明礬一兩六錢白硝一兩四錢水銀一兩右三味如法封固文武火五炷香擦盞冷定開罐取藥配用極能去腐生肌退管生肌散前靈藥四錢沒藥乳香兒茶俱去油各二錢珍珠一錢或加冰片人參更妙右共為細末摻瘡上去腐生新其應如響真元會臺丹皂礬白礬水銀火硝食鹽各二兩右共研勻結胎封固文武火五灶香降足冷定開罐取底下降藥制過配用仙靈白雪餅前制降藥一兩熟滑石水飛二錢右二味用山茨菰末滾水打糊和成小餅量瘡大小掐用些二方立能去毒根不致走散天月閒來丹焰硝六錢白礬四錢水銀食鹽各二兩黑礬二兩六錢右共為細末研至水銀不見星為度結胎封固文武火三炷香降足取底下降藥制過配用如遇楊結毒可將此藥川麵糊丸如麥米大初服二丸次二丸又次四丸每早晚熱黃酒下視牙齦腫爛即止其瘡痂自落神效回生丹真蟾酥血竭各二錢乳香沒藥俱去油胡黃連各一錢天月閒來丹六分輕粉六分麝香硃砂冰片各四分右共為細末生蟾酥為丸如黍米大每服一丸蔥白煎湯送下發汗避風加瘡走遍身發腫昏迷不省仍用三丸研為末蔥白煎湯灌下其腫立消真起死圓生之聖藥也發背疔瘡雙蛾對口方蟾酥一錢雄黃硃砂各四分血竭輕粉各六分粉霜五分冰片五分乳香沒藥麝香各三分右共為細末丸如菜子大硃砂為衣每服三丸喉蛾舌上噙化發寒用蔥白好酒送下百毒瘡陽物爛下可保重生方紅紛霜一兩牛黃鍾乳粉各五錢右共為末如陽物爛加婦人初行經紅布棍襠燒灰五分如百毒爛者用粉霜一兩加洗過皂布燒灰一兩如鼻爛加壯實人修下腳皮三錢研細摻之效難盡述梅花點舌丹此丹治上部初起惡毒硃砂雄黃乳香沒藥血竭硼砂葶藶各一錢沉香牛黃蟾酥白靈藥冰片各五分麝香珍珠熊膽各三分右共乳極細酒和為丸如萊蔔子大金箔為衣烘乾封固加男胎乳尤炒服用蔥白酒送下三五丸量毒之微甚加減取醉十寶丹此丹配靈藥治諸症詳見後條牛黃五分冰片三分五釐歸尾阿魏各一錢白芷丁香乳香明雄各三錢槐花一錢二分沒藥二錢右為末加後藥五錢磁罐收用大保減巢丹此丹系靈藥汞一兩五錢火硝一兩三錢明礬鹽各一兩硼砂三錢文武火三炷香升用打靈砒法白砒四兩先用緑豆水甘草水煮乾右人罐封固打火三炷香取出配前二料米飲調丸緑豆大每服五丸日三服隨引用一毒在腹用丹一錢五分砒一分五釐川芎藁本白芷瓜蔞湯下一毒在鼻丹二錢砒一分五釐花粉共丸山梔川芎煎湯下一毒在耳丹砒分兩照前花粉共丸川芎石菖蒲湯下一毒在喉丹砒分兩照前花粉共丸川芎湯下一毒在背丹砒分兩照前花紛五錢共丸川芎柴胡湯下一毒在腰上下兩脅丹四錢重日五錢砒二分半牡蠣煆一錢人參五分共丸黃耆牛膝花粉煎湯熱送下一毒在腿丹五錢砒二分半花粉三錢防己五錢共丸木瓜牛膝苡仁湯下一毒在腳底丹六錢砒三分半花粉沉香各五錢共丸木瓜牛膝湯下一毒在下疳丹三錢砒一分半牛膝豬苓湯下一婦人並陰內上下年久爛見骨者手足不能伸屈丹八錢砒三分半花椒三錢共丸牛膝湯下一陰囊作癢抓破流水不幹丹四錢砒一分半地膚子牛膝蒼朮湯下一魚口丹三錢砒一分半牛膝牙皂湯下一筋骨疼痛遍身紅腫不能行走不論遠近丹八錢砒二分牛膝槐花湯下一遍身作癢水腫風瘡為血熱風丹五錢砒一分半花粉五錢為丸牛膝川芎款冬花湯下一癬毒痘毒丹五錢砒一分半花粉五錢共丸牛膝苦參湯下一瘰癧穿爛日久不愈丹六錢砒二分半舊疏璃底共丸夏枯草昆布海藻滑石花粉瓜蔞湯下一濕痰流注潰爛日久不愈丹五錢砒二分半川芎白芷牛膝湯下一發背癰疽疔瘡腫毒丹三錢砒一分蟾酥二分共丸川芎白芷山甲湯下一毒在腦頂爛見骨者丹一錢五分砒一分半川芎藁本湯下以上諸症須用活法看人老幼虛實新久輕重淺深重者不過一月輕者不過半月收功若虛者加入參黃氏白朮茯苓補之如虛人服之必發寒熱喉痛頭眩是藥所致切勿疑忌停一二日再服可也切忌酒色煎炒五辛發味服藥先用五丸至七丸為止日進三服加黍米大柱下遺佩丹一名老君丹汞食鹽各一兩火硝明礬皂礬各二兩右共研勻結胎封固升三炷香一文二武冷定取出升藥配後群藥用如升藥三錢外加蜈蚣酒炙全蠍酒炙殭蠶炒防風曬荊芥曬川山甲土炒三七炙硃砂雄黃乳香沒藥各一錢五分合前藥為丸硃砂為衣或花粉為衣每日清晨空心服七釐陳酒送下重者土茯苓蕩下四十九日內忌羊肉生冷等發味如若口破緑豆煎湯常嗽口停三兩日再服能治瘰癧未潰已潰楊梅結毒癰疽等惡瘡輕則十服重則一月愈驗如桴鼓靈藥祕方卷上終
