body:
  text: 靈藥祕方卷之下神仙一剪梅無為真人流傳乃濟世之神方也專治五經痰火久咳氣喘不止吐血紫痰紅色諸藥不效難療之症此藥一進血自歸經三服見效七服除根陽丹法鉛汞硼砂明礬各一兩火硝二兩右先將鉛化開入汞攪勻冷定研碎再入後三昧研勻入罐封固打火三炷香開取盞上靈藥陰丹法汞三兩硫黃八錢右共研為末入杓內炒硬傾地下冷取起再研入罐封固打火三炷香取蓋下藥配用配法陽丹二錢陰丹八錢再陰丹二錢陽丹八錢共配二兩聽用入沒藥加藥方辰砂胡連青黛緑豆紛白糖各一兩沉香海粉天竺黃兒茶冰片各三錢熊膽麝香牛黃各五錢右共為細末再用嫩滑石一兩磨濃汁調丸如桐子大每服三五顆照後各經病症用藥煎湯送下一心經受病吐血成片鮮紅者是用遠志肉甘草湯煮白茯苓乳汁浸過石連子棗仁炒研甘草煎湯送下五七丸一肝經受病吐血或紫檀色者是用膽草甘草煎煮過柴胡炒白芍青皮甘草煎湯送下七丸一脾經受病吐痰稠黏不斷帶血絲者是用青皮陳皮白朮土炒甘草煎湯送下七丸一肺經受病吐痰黃白色作血腥者是用知母貝母杏仁去皮尖桑白皮蜜炙甘草煎湯下七丸一腎經受病吐痰成塊如魚凍者是用知母乳汁浸炒五味子枸杞子黃柏鹽水炒甘草煎湯送下五七丸以上諸方系山西超師金陵佴先生二人所授實實丹此藥能治各症配藥方乳香沒藥雄黃丁香硃砂輕粉各一錢當蹄白芷槐花各三錢右共為細末聽配靈藥如毒在上加升麻在下加牛膝木瓜隨症引用內中加牛黃更妙靈藥方制白砒制土硫各四兩右共細末入罐封固打火四炷香取盞上藥如琥珀色者佳黃象用約有靈藥六七錢米糊為丸重二三釐遇病隨引加減一肺經面赤喘促加黃耆一脾經胃大腸熱加大黃芒硝一少陽膽症加石菖蒲蔞仁一肝經加龍膽草甘菊黃柏芍藥一凡一切瘡毒痛者只須回生散加六腎散依後六門法治之一外點諾頑瘡惡毒腐肉作膿亦用並楊梅結毒不必問其新久淺深同時制宜月之萬無一失回生散腫毒初起用主發散番木鱉淨末四兩用水泡透去皮淨咀片少用麻油炒紫黃色以脆為度研細川山甲一兩麻油妙脆瓜兒血竭五錢炙乳香三錢去油淨沒藥三錢去油淨右共為細末研勻收固每服三分至五分止切不可多用預囑病者倘暈麻發戰切勿驚疑一時性過即安服時忌風若煉蜜為丸可加六賢散以乳沒血竭為衣服後麻戰飲熱酒或美湯一鍾即止此藥與前六腎散並用之乃治內外症之要藥也凡治外症須分六門治法先痛而後腫者氣傷形也先腫而後痛者形傷氣也喜怒傷氣熱傷氣故先痛也寒傷形暑傷形故先腫陰陽應象此其理也素問論之無過血症體熱氣症體涼精病虛神病弱陰病頑陽病痹一治毒氣流入太腸痔漏久治不愈並流注惡症用靈藥一分加至二分日二服白湯或酒下一楊梅結毒在頭上者寶丹一錢五分重者三錢靈藥五釐川芎藁本各二錢皂角一枚煎湯服一結毒在面上者寶丹一錢五分靈藥一分川芎二分土茯苓四兩煎湯食後服一結毒在日鼻者寶丹二錢靈藥一分桂枝川芎各二錢土茯苓四兩煎湯食遠服一結毒在腳上及腳底者寶丹一兩靈藥三分天花粉一兩二錢沉香五錢共為細末丸粟米大日進三服每次一錢土茯苓湯空心下一結毒在兩耳者寶丹一錢五分重者二錢靈藥一分天花粉一兩川芎三錢共研細為丸每服三分土茯苓湯下一赭毒在兩臂者寶丹三錢靈藥五釐柴胡川芎土茯苓湯下一結毒在腰脅者寶丹四錢加重五錢靈藥一分若臭爛甚者再加靈藥一分花粉一兩杜仲牛膝各三錢為丸每服五分土茯苓皂角小麥煎湯下日三服一赭毒在兩腿者寶丹三錢靈藥一分牛膝三錢天花粉五錢土茯苓四兩煎湯食前服一結毒在小便上者寶丹五錢靈藥二分牡蠣煆一錢白朮一兩人參二錢土荻苓三兩共為細末蜜丸緑豆大每服一錢土茯苓四錢五分牛膝三錢花粉五錢煎湯空心下以上結毒諸症看人虛實如虛者皆可量加入參黃耆白朮煎湯補之一治癰疽發背毒爛不愈寶丹四錢靈藥一分蟾酥三分為末蜜丸蘿蔔子大每服六七分日三服海藻昆布夏枯草煎湯下一治疳瘡實丹三錢靈藥一分滑石一兩為丸每服三錢牛膝一兩土茯苓三兩皂角一枚煎湯空心服之一治串癧不愈寶丹六錢靈藥一分天花粉滑石各一兩為末米糊丸如菜子大每服五分海藻昆布夏枯草煎湯食後服日三次一治陰囊空爛寶丹四錢靈藥一分滑石一兩米糊為丸牛膝三錢土茯苓四兩皂角一枚煎湯空心服一治身腫紅色有風瘡熱瘡者寶丹三錢靈藥一分二釐牛膝三錢土茯苓四兩皂角一枚煎湯食遠服一治遍身筋骨疼痛坐臥不安行走不得遠年者寶丹五錢五分靈藥一分五釐牛膝三錢獨活二兩土茯苓四兩共為末丸緑豆大每服一錢皂角煎湯下一治遠年臁瘡寶丹五錢靈藥一分五釐牛膝三錢木瓜一兩二錢共為末蜜丸每服五分土茯苓四兩皂角一枚煎湯下日三服一治咽喉腫毒寶丹二錢靈藥一分天花粉桔梗射干山豆根各三錢為末蜜丸每服一錢土荻苓三兩煎湯送下日三服一治婦人玉門腫痛或下膀胱手足不能動寶丹五錢靈藥一分五釐滑石一兩牛膝三錢為末米糊丸每服一錢土茯苓四兩皂角一枚煎湯送下日三服萬寶丹端治臌膈等症水銀密陀僧白礬食鹽炒火硝各一兩明雄黃五錢硃砂五錢滁州青磁器打碎研細二兩右先將水銀磁末共研不見星次下陀僧再研再下礬鹽硝雄砂共研勻入陽城罐內封日升三炷香取出靈藥二轉加法取前靈藥又加水銀一兩研不見星又下火硝鹽礬各一兩明雄硃砂各五錢研勻聽用再取出山鉛四兩打薄剪碎放陽城罐底上再放藥末在土封固打三炷香取靈藥配後藥川配藥法每前藥一錢用牛黃狗寶五分珍珠琥珀直殭蠶糯米炒全蠍酒洗去頭足糯米炒沉香川貝毒硼砂硃砂雄黃明粉木香川連吳茱萸煮川芎白芥子蘿蔔子以上各一錢巴豆仁甘草水煮去油五分麝香三分牙皂八分炒金跟箔各三十張五倍子一個打一孔入大黃末填滿塞緊入多年瓦便壺內封口火煆侯冷取五倍子大黃為末與前諸藥和勻用小竹刮青煎汁打糊為丸蘿蔔子大硃砂為衣初服三分五釐用雄鼠糞煎湯下以後只用竹青煎湯微加薑汁服鬱金至寶起危散拔死靈丹專治五癆七傷極重極危一切惡症青礞石硃砂雄精明礬磁石醋淬三次南鉛北鉛雌黃各二兩右八味於五月午日用陽城罐封固升打五炷香冷取靈藥袋盛埋東方淨土內四十兒日取起另配沒藥配藥法沉香木香乳香沒藥鬱金熊膽牛黃訶子各一錢狗寶冰片各五分乳細研勻每靈藥七釐配沒藥三釐米糊成丸金箔為衣服時用蜜水化開忌鐵器如服此藥病愈後稍覺火氣用後煎方煎藥方黃芩黃柏知母生地白茯苓各一錢甘草五分梔子陳皮各八分右八味白水煎空心服九轉靈丹統治四時傷寒五癆七傷中風痰喘隔食瘧痢痰嗽男婦諸般病症極其靈效靈砂石菖蒲一寸九節者佳各一兩生礬九錢制辰砂制雄黃各五錢以上俱為細末棗肉杵爛為丸如粟米大金箔為衣陰乾收固此藥能問精添髓壯顏補虛每服二十丸棗湯下老人服之精神不損百病不生終無隔食之患及多尿溺亦無遺精白濁勞瘵盜汗等症婦人服之無崩漏赤白帶下之病按本方又云此丹服之百痛皆除欲求長生終日安樂者每晨空心棗湯下十丸此真方士荒唐之説不足信培謂無病之人斷不可服也制汞法先將硫黃入鍋熔化以益母草煎濃汁投硫入汁中七次取硫用出山北鉛化開投硫在內此鉛面上化開遂取出入益母草汁中數次以硫不腥臭為度去鉛不用只用硫黃佐汞煽炒成青筋頭子短汞十兩制硫二兩五錢煸畢入罐打火五炷香取出聽用將取出靈砂每兩制硫一錢照前再煽打至第七回靈砂每拾兩梨硫九錢八回用八錢九回用七錢此九轉之度也制砂法每硃砂一兩用黃蠟五錢同入鍋內熬化微火半灶香復以武火熬蠟干將紙點火放鍋內灼盡吹去蠟灰取砂用以砂紫色為度制雄黃法用防已數兩煎汁入明雄黃煮乾制硫黃法以前靈砂制硃砂用青布做二小袋將二味分盛袋中採寶劍金星草生於松樹上者如劍有明星多煎汁二袋懸胎煮至硫黃白色為度按金星草能去硫毒培意以黃山雲霧草代之功似更勝也小九轉靈丹前制靈砂蘆蒼各一兩前制硃砂洛陽花各五錢右共為細末用小銅鍋人蜜少許候花開上用盞蓋之蜜熟即丸如緑豆大金箔為衣隨症照後引下立刻見效萬無一失一男子遺精白濁每清晨燈心蓮肉湯下三丸一小兒急驚木香研細末薑汁竹茹湯調勻化下三丸以痰降為度一小兒急慢驚人參白朮當歸陳膽星半夏竹瀝薑汁化工三丸一老人中風防風通聖散煎湯送下三丸如類中虛症獨參湯下一結胸大小柴胡湯下三丸一傷寒有汗者桂枝湯下三丸一陰症附子人參肉桂炮薑湯下三丸或五丸一痰嗽半夏茯苓湯下三丸一痰喘當歸竹瀝湯下三丸虛喘加入參一腳氣防風當歸木瓜牛膝羌活秦艽湯下三丸一麻木不仁黃耆天麻湯下三丸一諸般疼痛乳香沒藥湯下三丸一黃疸炒山梔茵陳湯下三丸一諸蟲積桃仁楝樹根煎湯下三丸楝樹根要掘取向南者佳朝北者不可用能傷人一耳病耳聾耳痛黃柏生地石菖蒲湯下三丸一口破及痛爛等症山豆根黃芩骨皮湯下三丸一三焦煩熱作渴人參白朮麥冬知母湯下三丸一赤淋白帶二陳湯下三丸一諸般腫毒人參麝香湯下三丸按腫毒症似不宜服此丹若陰毒不紅腫不知痛者則可用一癲症蜈蚣乳香沒藥湯下三丸一痢疾好陳酒送下三丸一瘧疾生薑湯送下三丸一中風不語握拳咬牙閉目不省人事者人參黃耆白朮附子各五分川烏四分甘草少許竹瀝薑汁三匙大棗枚煎湯灌之俟蘇醒後再用竹瀝薑汁湯下三丸一中風不醒服前藥後更進三丸再用順氣散數劑相其虛實調理即愈釣瀝丹治瘰癧未潰內中有實核者食鹽明礬硝各一兩汞五錢皂礬春夏錢秋二錢三分冬二錢五分右稱準入罐結胎爐內熏蒸炷香然後加升火炷香冷定取盞底藥黃米飯研丸粟米大陰乾收固臨用不拘何膏藥以一丸貼之天寒五日一換暑天三百一換內核自然脫出後即將七仙丹輕輕拂之燃後以生肌散一兩加七寶丹一錢五分和勻每用些須摻上以膏藥貼之漸漸生肌自滿釣癧褪管生肌丹此丹專取癧子硝鹽礬汞各三錢皂礬五分硇砂金鼎砒各一錢右共乳細入罐封固升取靈藥蜜丸緑豆大不拘何膏藥護之管核即從此出破爛者加蟾酥少許不痛連生四五個者不必俱貼只貼一個衆癧即從此出出盡上生肌散七仙丹愈痔漏退管生肌丹此丹專治痔漏鉛一斤石黃四兩硫黃一兩汞二兩硃砂三兩右人罐封固升打文武火各三炷香開取靈藥棗肉為丸每服六釐空心土荻苓湯下忌煎炒又方元精石一錢五分硃砂明雄膽礬各三錢枯礬八錢硫黃四錢汞石黃各五錢右八味共研不見星入罐封固水盞打火五炷香三文二武開取靈藥配後末藥用末藥方番木鱉去皮香油炒黃脆冰片蜣螂龜板各二錢川連珍珠戴過油舊者豆腐煮用全蠍去足酒洗象牙各三錢人牙煆存性川山甲炒各一錢六分蜈蚣去頭足三條以上依制共研極細入前靈藥二錢四分再乳勻外用上好淨黃蠟八兩入皮碗坐竹筒上置鍋內隔水墩至蠟化將藥陸續投入象箸攪勻丸如棗核大每顆約重三分為則看症輕重少則一粒多則五粒空心黃酒下忌房事煎炒炙傳之物先以地榆苦參煎湯熏洗數日然後服藥其瘡將瘥以輕粉藥珠為末摻之荔奴丹此丹專治楊梅結毒並治大麻風神效人言二分水銀三錢火硝皂礬明礬各六錢雄黃一錢銅緑五分食鹽一兩二錢右為細末研不見星川銀罐七八個將藥分貯罐內約有二四分深放風爐上文火熔化結胎先要將各罐口磨平俱覆於銅盆上外用水一大盆座銅盆於上加炭火勿露罐先文後武一炷香即退火取藥當時飯研為丸如黍米大每服一丸或二丸龍眼肉包住外加豆腐皮裹之鹽湯吞下餓一日藥行遍身方可飲食此方不損元氣並治大麻風如神服藥後大便要在空地深坑之處以厚土掩之勿令毒氣傳人一點消神方統治一切大小瘡毒初起百發百中鹽礬硝皂礬汞各四兩砒四錢右共研不見星入罐微火結胎用木棍築實冷定覆於碗上碗底放水盆一個磚一塊放碗罐於磚上加水至碗底八分另以大磚隔往砌百眼爐上火下火看火到底即遏火冷定取藥收固治毒時以米醋少許燈草蘸點患處毒小可點二三點起出一二個白泡即消毒大者多點幾點或多點幾次亦無不俏如遇頑陰之毒服奪命丹一服點之亦無不收功七仙丹一名七寶丹專治去腐肉配生肌散用鹽礬硝汞皂礬各一兩鵝管石硃砂各三錢右共研細末入罐封問升三炷香冷定取藥用生肌散此散生肌退管配靈藥用每一兩配七仙丹一錢五分和勻每用些須摻上膏掩漸自生肌乳香沒藥兒茶輕粉石脂龍骨白蠟硃砂海螵峭川貝自然銅煆右等分研細如面收用遇潰爛者先將米泔水洗淨以此藥輕輕拂上膏藥貼之久患成漏者以膏藥捻成條子蘸此散插入漏處退管生肌如毒重不效須用前釣癧丹釣去壘塊之後方可用此收功紅粉霜丹火硝枯礬硼砂水銀皂礬煆各一兩右共為細末入罐內燒酒拌勻炒至黃色再入硃砂五錢雄黃三錢封口打火文武三炷香約有靈藥一雨配硃砂一兩乳勻用絹包好貼體帶一月再人瓶收固每服五匣不可多用車前子煎湯下此藥能治大人小兒一切風痰諸效不效此丹入口有回生之功以上諸方系陝西楊先生所授痔漏大靈藥鵝管石三錢明礬雌黃雄黃鉛礦石倭硫黃出山黑鉛熔傾地上打如紙薄切作細絲各五錢辰硃砂一兩青鹽青礞石藝香取黑色者用各二錢右共為細末川大陽城罐一個先護好盛藥封固上火約香一炷再以熟石羔周身護到文武火共五灶香取靈藥收貯每服三釐加後潤腸散七分和勻棗肉或米飲為丸豆腐皮裹服空心白滾湯或陳火酒送下潤腸散朴硝一斤童便雨碗拌入鍋內炒乾雄豬大腸頭尺許晾取半乾右將硝研末入腸內不拘多少以塞為度兩頭線扎緊略曬片時入鍋內炒焦黃色研為細末配前靈藥服外以紙然蘸藥插入管中三山拱嶽丹此丹退管去惡生新硝一兩六錢水銀明礬各一兩右共研入鍋碗差泥封升一炷香取藥收用化管用新米飯打條插患處退管丸露蜂房十個鱉一個重十五兩煆野豬尾繭退人指甲鳳凰衣蟬退各四兩牛黃三錢右藥除牛黃俱要酒洗各煆成末麵糊為丸每服三錢空心酒下量人虛實用鴻蒙交盼丹端治楊梅結毒神效火硝二兩五錢食鹽明礬皂礬各二兩水銀一兩硼砂三錢雄黃一錢硃砂一錢右先以明礬打豆大入陽城罐內後以諸藥為末入內封固炭火漸加不過半罐而止升三炷香冷定取藥白色者佳每藥五分配槐花炒末四錢米糊丸勻作四十服土茯苓湯下忌茶醋發味橘並流芳丹此丹專去瘀肉水銀火硝明礬皂礬各二兩鹽一兩右共為末結胎入銀罐內覆瓦鉢中綿紙固濟外用細干黃土打碎蓋寸許露銀罐底加炭燒三炷香取起聽用有爛肉之功二轉杏林丹鹽礬皂礬硝汞各一兩右共研入罐升打三炷香取藥加入明雄硃砂硫黃各五錢硼砂三錢硇砂一錢研勻人罐再打五炷香取藥配入乳香沒藥兒茶血竭各一錢麝香一分五釐棗肉為丸緑豆大收固用凡痔漏服十丸小兒痞塊服三丸腫毒楊梅服五丸俱黃酒下如搽一切瘡毒取藥一兩入草烏末一錢豬膽汁調搽或鵝膽亦可黃靈藥此生肌長肉仙方也鉛九錢汞雄黃各一雨火硝三兩枯礬二兩硃砂四錢右先將鉛化開同話味為末入罐封固升打三炷香擦盞火足冷定取藥每藥一錢加乳香沒藥海嫖蛸水煮珍珠各五分血竭象皮煆各四分兒茶三錢輕粉赤石脂煆龍骨煆各三分黃柏文蛤殼煆各二分甘草六分冰片五釐麝香二釐共為細末乳勻收固聽用萬應靈丹此丹初起拔毒甚妙青鹽水銀各五錢皂礬一兩鉛二錢五分火硝一兩二錢五分白礬一兩五錢硼砂白毗雄黃各一錢五分右先將鉛化開入水銀和勻待冷同各味研細末用磁罐一個將生薑遍擦罐外火烘又擦八九次為度將藥三分之一入罐火上頓熱滾候乾枯些又加上照此頓法去候乾枯色紅為度將罐口覆在磁盆內鹽泥封固罐口周圍用灰堆齊罐底於罐底上放炭火四五塊待一炷香盡又去灰火隨移下些三灶香盡去些灰將炭火移下些候一灶香為止取靈藥收用其藥雪白者佳煉時罐盆外須放砧擱水浸著藥方下降一治疔瘡用銀針刺一孔醋調靈丹三四毫點上外用膏藥貼之一夜全消對口諸毒俱照此法初起一二日日上藥三次一遇發背癰疽根盤大者用靈丹二分貝母末一錢細茶滷半杯調勻新筆藥從外根掃圈至內以藥盡為度過一二時根盤上火熱疼痛即將冷水洗去另用膏藥貼之過一夜揭看有一毛孔即有一黃泡用銀針逐一挑去黃水即愈雲和化育丹此丹生肌倉硝二兩陀僧枯礬水銀各一兩右先將硝陀礬為末和勻放粗磁碗內中按一窟以水銀放窟中用小碗蓋上鹽泥封固碗底上放水濕草一團將磚壓紙上再以大鐵釘三個架擱粗碗外造百眼爐打火以濕紙焦枯為度開取靈藥用甘草湯浸過再曬乾收用膽礬硃砂雄黃明礬磁石水銀各一兩或加硝一兩更佳右共研勻入罐封固打火三灶香開取靈藥聽用此藥能治一切腫毒去瘀生新其效如神或加入外科諸藥中用之亦妙千金白雪丹汞鹽各二兩硝五兩明礬六兩皂礬四兩黑鉛一兩白砒雄黃各六錢硇砂研末硼砂炒末各一錢右先將黑鉛化開入汞研碎再將鹽礬硝皂入鍋炒六分干鉛汞硇硼砒雄共研不見星裝入罐內築實降三炷香為度取出靈藥每兩配入真蟾酥一錢乳勻收固每用少許點毒頂上未成者立即消散已成者即起頭迫膿而愈如治漏用麻黃煎膏作條子插入管內靈餅子水銀青鹽各一兩鉛五錢雄黃金頂砒硼砂硃砂各三錢硝二兩五錢皂礬二兩五錢明礬三兩右共為細末入罐封固打火三灶香冷取靈藥每靈藥七分配蝸牛殼煆末二分再以面一分為糊做成小餅用膏藥蓋貼提毒如神鍊金頂砒法白砒二兩鉛八兩或一斤更妙先將鉛入罐內炭火煆化再投砒於鉛之上煉至煙盡為度取起冷定打開金頂砒結在鉛面上取下聽用煙起時宜遠避之
